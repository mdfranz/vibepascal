[project]
name = "vibepascal-shared"
version = "0.1.0"
description = "Shared helpers (guidance loader, LLM observability, MCP command policy) used across the framework client packages."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vibepascal_shared"]
