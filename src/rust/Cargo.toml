[package]
name = "dustwood-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dustwood-rs"
path = "src/main.rs"

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
configparser = "3"
clap        = { version = "4", features = ["derive"] }
crossterm   = "0.27"
rand        = { version = "0.8", features = ["small_rng"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
